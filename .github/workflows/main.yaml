name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build diagnostic executable
      run: |
        pyinstaller --noconfirm --onefile --console --paths=. --add-data "fonts;fonts" --add-data "icons;icons" --add-data "style_1.qss;." --icon="icons/app_con.ico" --name="mouain_app_v1-3_2_diagnostic" main.py

    - name: Build application executable
      run: |
        pyinstaller --noconfirm --onefile --noconsole --paths=. --add-data "fonts;fonts" --add-data "icons;icons" --add-data "style_1.qss;." --icon="icons/app_con.ico" --name="mouain_app_v1-3_2" main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/*.exe
